name: Update profile

on:
  workflow_dispatch:
  schedule:
    # First day of every month, 02:17 UTC / 07:47 IST.
    - cron: '17 2 1 * *'
    # For daily updates, replace the line above with: '17 2 * * *'

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin imagemagick fonts-liberation fonts-dejavu-core fonts-noto-core fonts-noto-mono gh

      - name: Refresh public GitHub data
        env:
          GH_TOKEN: ${{ secrets.PROFILE_READ_TOKEN || secrets.METRICS_TOKEN || github.token }}
        run: python3 build/refresh_data.py

      - name: Rebuild profile artwork
        run: |
          python3 build/build_calendar.py
          python3 build/build_animation.py
          python3 build/build_clickable.py
          python3 build/build_about.py
          python3 build/validate_profile.py

      - name: Commit updated artwork and data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add README.md assets/header*.png assets/activity*.svg assets/activity*.png assets/card-*.gif assets/card-*.png assets/about*.svg assets/about*.png data/calendar.json data/snapshot.json build/selected.json
          if git diff --cached --quiet; then
            echo "Profile is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update profile activity and project stats'
          git push origin "HEAD:$DEFAULT_BRANCH"
